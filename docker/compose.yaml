name: discord-mcp

services:
  server:
    image: ghcr.io/mia-cx/discord-mcp/server:${DISCORD_MCP_VERSION:-main}
    restart: unless-stopped
    read_only: true
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set the public HTTPS URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set the public hostname}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:?set the relay Discord application ID}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:?set the relay OAuth client secret}
      DISCORD_OAUTH_ALLOWED_USER_IDS: ${DISCORD_OAUTH_ALLOWED_USER_IDS-*}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?set a random 32-byte base64 key}
      DISCORD_MCP_REST_TIMEOUT_MS: ${DISCORD_MCP_REST_TIMEOUT_MS:-15000}
      DATABASE_URL: ${DATABASE_URL:-}
      TOKEN_VAULT_KEY: ${TOKEN_VAULT_KEY:-}
    ports:
      - '127.0.0.1:3000:3000'
