# A self-hosted deployment.
#
# Two processes with a deliberate asymmetry: the server holds the credentials and no Docker socket;
# the supervisor holds the Docker socket and no credentials. They meet on one Unix socket.
#
# `DOCKER_HOST` must point at a **rootless** daemon. Under rootful Docker the supervisor's isolation
# guarantees weaken to the point where they are not worth stating.

name: discord-mcp

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      # Losing this makes every stored OAuth2 token and route secret unrecoverable. Back it up
      # somewhere other than this host.
      DISCORD_MCP_MASTER_KEY: ${DISCORD_MCP_MASTER_KEY:?set DISCORD_MCP_MASTER_KEY}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DISCORD_MCP_WORKFLOWS_ENABLED: ${DISCORD_MCP_WORKFLOWS_ENABLED:-false}
      # The same value on both services. This is what stops any other local process from driving
      # the supervisor.
      DISCORD_MCP_SUPERVISOR_CREDENTIAL: ${DISCORD_MCP_SUPERVISOR_CREDENTIAL:-}
      DISCORD_MCP_TOOLSETS: ${DISCORD_MCP_TOOLSETS:-operator,automation,api}
      DISCORD_MCP_CAPABILITY_DIR: /run/discord-mcp/capability
    volumes:
      - data:/data
      - supervisor-socket:/run/discord-mcp
      # The server serves each execution's capability socket here; workflow containers mount the
      # same volume restricted to their own execution's subdirectory. The server holds the grants
      # and the Discord credentials, so it is the right place for the broker to listen.
      - capability:/run/discord-mcp/capability
    ports:
      # Loopback only. Put Traefik in front before exposing this anywhere.
      - '127.0.0.1:3000:3000'
    depends_on:
      - supervisor

  supervisor:
    build:
      context: ..
      dockerfile: docker/supervisor.Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_MCP_SUPERVISOR_CREDENTIAL: ${DISCORD_MCP_SUPERVISOR_CREDENTIAL:-}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///run/user/1000/docker.sock}
      DISCORD_MCP_NPM_REGISTRY: ${DISCORD_MCP_NPM_REGISTRY:-https://registry.npmjs.org/}
    volumes:
      - supervisor-socket:/run/discord-mcp
      # The rootless daemon's socket. This is the one bind mount in the deployment, it goes to the
      # supervisor alone, and it never reaches a workflow container.
      - ${DOCKER_SOCKET:-/run/user/1000/docker.sock}:/run/user/1000/docker.sock

volumes:
  data:
  supervisor-socket:
  # Named `discord-mcp-capability` so the supervisor can name it without being told: it derives
  # every mount rather than accepting one.
  capability:
    name: discord-mcp-capability
