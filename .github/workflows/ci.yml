name: CI

# Every push and every pull request is checked. Images are built on all of them — a Dockerfile that
# stopped building should fail the pull request, not the release — but only pushed from `main` and
# from a version tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref. A superseded push has nothing worth finishing, except on `main` and tags, where
# cancelling could abandon a half-pushed manifest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Not `--ignore-scripts`: argon2 builds a native binding, and personal access tokens are
      # hashed with argon2id, so a test run without it would pass against a package that cannot
      # work in production.
      - run: pnpm install --frozen-lockfile

      # Biome, tsc --build, and Vitest. The e2e suites are excluded by config and need credentials.
      - run: pnpm check

      # The vendored OpenAPI document against the generated catalog: operation count, classification
      # coverage, the path-item parameter merge, and byte-for-byte determinism.
      - run: pnpm spec:check

      - name: Check the catalog is regenerated
        run: |
          pnpm spec:generate
          if ! git diff --quiet -- packages/discord-catalog/src/generated; then
            echo "::error::The generated catalog is out of date. Run 'pnpm spec:generate' and commit the result."
            git diff --stat -- packages/discord-catalog/src/generated
            exit 1
          fi

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packs @mia-cx/discord-catalog, installs the tarball in a workspace of its own, and runs it
      # in workerd with nodejs_compat off.
      - run: pnpm package:verify

  images:
    name: ${{ matrix.image }} (${{ matrix.platform.arch }})
    needs: check
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The stateless relay needs only the server image.
        image: [server]
        # Native runners rather than QEMU: argon2 compiles from source, and emulating that turns a
        # two-minute build into a twenty-minute one.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, and push nothing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          # Pushed by digest and assembled into one multi-architecture tag by the `manifest` job.
          # Tagging here would have the two architectures race to own the same tag.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scoped per image and architecture, or the four images would evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          # The filename is the bare digest; the manifest job reassembles the refs from it.
          digest='${{ steps.build.outputs.digest }}'
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish ${{ matrix.image }}
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server]
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
          # `latest` follows the newest version tag, never `main`: someone who pulls `latest`
          # should get a release, not whatever was merged an hour ago. `main` is its own tag.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ github.repository }}/${{ matrix.image }}

      - name: Report what was published
        run: |
          jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
